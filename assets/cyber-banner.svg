<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060608"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bc13fe"/>
      <stop offset="0.5" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#bc13fe"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 H 0 V 60" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse cx="800" cy="90" rx="460" ry="95" fill="#bc13fe" fill-opacity="0.18" filter="url(#blur)"/>
  <ellipse cx="800" cy="320" rx="540" ry="110" fill="#00f3ff" fill-opacity="0.10" filter="url(#blur)"/>

  <path d="M120 320H1480" stroke="url(#glow)" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M120 322H1480" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <text x="800" y="190" text-anchor="middle" fill="#ffffff" font-size="92" font-family="Share Tech Mono, Consolas, monospace" font-weight="700" letter-spacing="2">
    Parth Wankhede
  </text>
  <text x="800" y="250" text-anchor="middle" fill="#00f3ff" font-size="28" font-family="Share Tech Mono, Consolas, monospace" letter-spacing="4">
    SYSTEM PROGRAMMER // DSA ENGINEER
  </text>

  <text x="800" y="360" text-anchor="middle" fill="#bc13fe" font-size="18" font-family="Share Tech Mono, Consolas, monospace" letter-spacing="3">
    CYBERPUNK PROFILE INTERFACE
  </text>
</svg>
