<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Parth Wankhede</title>
  <desc id="desc">Cyberpunk animated banner for the GitHub profile.</desc>

  <style>

    /* ── background ── */
    .bg { fill: #0d0d0d; }

    /* ── grid lines ── */
    .grid-line { stroke: #00f3ff; stroke-width: 0.6; }
    .grid-v { animation: gridPulse 4s ease-in-out infinite alternate; }
    .grid-h { animation: gridPulse 4s ease-in-out infinite alternate-reverse; }

    @keyframes gridPulse {
      0%   { stroke-opacity: 0.04; }
      50%  { stroke-opacity: 0.18; }
      100% { stroke-opacity: 0.06; }
    }

    /* ── scanline ── */
    .scanline {
      fill: url(#scanGrad);
      animation: scan 3.5s linear infinite;
    }
    @keyframes scan {
      0%   { transform: translateY(-60px); }
      100% { transform: translateY(480px); }
    }

    /* ── neon glow orbs ── */
    .orb-purple {
      fill: #bc13fe; fill-opacity: 0.12;
      animation: orbFloat 6s ease-in-out infinite alternate;
    }
    .orb-cyan {
      fill: #00f3ff; fill-opacity: 0.08;
      animation: orbFloat 6s ease-in-out infinite alternate-reverse;
    }
    @keyframes orbFloat {
      0%   { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-12px) scale(1.06); }
      100% { transform: translateY(4px) scale(0.97); }
    }

    /* ── horizon line ── */
    .horizon {
      stroke-opacity: 0.55; stroke-width: 2;
      animation: horizonPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes horizonPulse {
      0%   { stroke-opacity: 0.35; }
      100% { stroke-opacity: 0.85; }
    }

    /* ── corner brackets ── */
    .bracket {
      stroke: #bc13fe; stroke-width: 2; fill: none;
      stroke-opacity: 0.5;
      animation: bracketFlicker 3s steps(2, start) infinite;
    }
    @keyframes bracketFlicker {
      0%, 100% { stroke-opacity: 0.5; }
      25%      { stroke-opacity: 0.9; }
      50%      { stroke-opacity: 0.3; }
      75%      { stroke-opacity: 0.7; }
    }

    /* ── title text ── */
    .title-main {
      font-family: 'Share Tech Mono', Consolas, monospace;
      font-size: 88px; font-weight: 700;
      fill: #ffffff; letter-spacing: 2px;
      filter: url(#glowFilter);
      animation: textGlow 3s ease-in-out infinite alternate;
    }
    @keyframes textGlow {
      0%   { opacity: 0.88; }
      50%  { opacity: 1; }
      100% { opacity: 0.92; }
    }

    .title-sub {
      font-family: 'Share Tech Mono', Consolas, monospace;
      font-size: 26px; fill: #00f3ff;
      letter-spacing: 5px;
      animation: subtitleFlicker 4s ease-in-out infinite alternate;
    }
    @keyframes subtitleFlicker {
      0%   { opacity: 0.7; fill: #00f3ff; }
      50%  { opacity: 1;   fill: #00f3ff; }
      100% { opacity: 0.8; fill: #39f5ff; }
    }

    .title-bottom {
      font-family: 'Share Tech Mono', Consolas, monospace;
      font-size: 17px; fill: #bc13fe;
      letter-spacing: 4px;
      animation: bottomPulse 2s ease-in-out infinite alternate;
    }
    @keyframes bottomPulse {
      0%   { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ── decorative particles ── */
    .particle {
      fill: #00f3ff; fill-opacity: 0.5;
      animation: particleDrift 8s linear infinite;
    }
    .particle:nth-child(odd) {
      fill: #bc13fe;
      animation-duration: 11s;
    }
    @keyframes particleDrift {
      0%   { opacity: 0; transform: translateY(0); }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-120px); }
    }

    /* ── data stream lines ── */
    .data-stream {
      stroke: #00f3ff; stroke-width: 1; stroke-opacity: 0.15;
      stroke-dasharray: 8 16;
      animation: streamFlow 6s linear infinite;
    }
    @keyframes streamFlow {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -240; }
    }

    /* ── cursor blink ── */
    .cursor {
      fill: #bc13fe;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>

  <defs>
    <!-- glow filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowFilterBright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- scan gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00f3ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- horizon gradient -->
    <linearGradient id="horizGrad" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#bc13fe" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#bc13fe"/>
      <stop offset="50%"  stop-color="#00f3ff"/>
      <stop offset="80%"  stop-color="#bc13fe"/>
      <stop offset="100%" stop-color="#bc13fe" stop-opacity="0"/>
    </linearGradient>

    <!-- vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0d0d0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0.65"/>
    </radialGradient>

    <!-- perspective grid gradient -->
    <linearGradient id="perspFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#00f3ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- ██ BACKGROUND ██ -->
  <rect class="bg" width="1600" height="420"/>

  <!-- ██ GRID ██ -->
  <g>
    <!-- vertical lines -->
    <line class="grid-line grid-v" x1="100"  y1="0" x2="100"  y2="420" style="animation-delay:0s"/>
    <line class="grid-line grid-v" x1="200"  y1="0" x2="200"  y2="420" style="animation-delay:0.3s"/>
    <line class="grid-line grid-v" x1="300"  y1="0" x2="300"  y2="420" style="animation-delay:0.6s"/>
    <line class="grid-line grid-v" x1="400"  y1="0" x2="400"  y2="420" style="animation-delay:0.9s"/>
    <line class="grid-line grid-v" x1="500"  y1="0" x2="500"  y2="420" style="animation-delay:1.2s"/>
    <line class="grid-line grid-v" x1="600"  y1="0" x2="600"  y2="420" style="animation-delay:0.15s"/>
    <line class="grid-line grid-v" x1="700"  y1="0" x2="700"  y2="420" style="animation-delay:0.45s"/>
    <line class="grid-line grid-v" x1="800"  y1="0" x2="800"  y2="420" style="animation-delay:0.75s"/>
    <line class="grid-line grid-v" x1="900"  y1="0" x2="900"  y2="420" style="animation-delay:1.05s"/>
    <line class="grid-line grid-v" x1="1000" y1="0" x2="1000" y2="420" style="animation-delay:0.2s"/>
    <line class="grid-line grid-v" x1="1100" y1="0" x2="1100" y2="420" style="animation-delay:0.5s"/>
    <line class="grid-line grid-v" x1="1200" y1="0" x2="1200" y2="420" style="animation-delay:0.8s"/>
    <line class="grid-line grid-v" x1="1300" y1="0" x2="1300" y2="420" style="animation-delay:1.1s"/>
    <line class="grid-line grid-v" x1="1400" y1="0" x2="1400" y2="420" style="animation-delay:0.35s"/>
    <line class="grid-line grid-v" x1="1500" y1="0" x2="1500" y2="420" style="animation-delay:0.65s"/>

    <!-- horizontal lines -->
    <line class="grid-line grid-h" x1="0" y1="60"  x2="1600" y2="60"  style="animation-delay:0s"/>
    <line class="grid-line grid-h" x1="0" y1="120" x2="1600" y2="120" style="animation-delay:0.4s"/>
    <line class="grid-line grid-h" x1="0" y1="180" x2="1600" y2="180" style="animation-delay:0.8s"/>
    <line class="grid-line grid-h" x1="0" y1="240" x2="1600" y2="240" style="animation-delay:0.2s"/>
    <line class="grid-line grid-h" x1="0" y1="300" x2="1600" y2="300" style="animation-delay:0.6s"/>
    <line class="grid-line grid-h" x1="0" y1="360" x2="1600" y2="360" style="animation-delay:1.0s"/>
  </g>

  <!-- ██ PERSPECTIVE GRID (bottom) ██ -->
  <g opacity="0.3">
    <line x1="800" y1="320" x2="0"    y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="200"  y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="400"  y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="600"  y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="1000" y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="1200" y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="1400" y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <line x1="800" y1="320" x2="1600" y2="420" stroke="url(#perspFade)" stroke-width="0.8"/>
    <!-- horizontal perspective lines -->
    <line x1="200" y1="350" x2="1400" y2="350" stroke="#00f3ff" stroke-opacity="0.07" stroke-width="0.6"/>
    <line x1="100" y1="370" x2="1500" y2="370" stroke="#00f3ff" stroke-opacity="0.05" stroke-width="0.6"/>
    <line x1="0"   y1="390" x2="1600" y2="390" stroke="#00f3ff" stroke-opacity="0.04" stroke-width="0.6"/>
    <line x1="0"   y1="410" x2="1600" y2="410" stroke="#00f3ff" stroke-opacity="0.03" stroke-width="0.6"/>
  </g>

  <!-- ██ DATA STREAM LINES ██ -->
  <line class="data-stream" x1="50"   y1="0" x2="50"   y2="420" style="animation-delay:0s"/>
  <line class="data-stream" x1="250"  y1="0" x2="250"  y2="420" style="animation-delay:1.5s; stroke:#bc13fe"/>
  <line class="data-stream" x1="1350" y1="0" x2="1350" y2="420" style="animation-delay:3s"/>
  <line class="data-stream" x1="1550" y1="0" x2="1550" y2="420" style="animation-delay:4.5s; stroke:#bc13fe"/>

  <!-- ██ SCANLINE ██ -->
  <rect class="scanline" x="0" y="0" width="1600" height="60"/>

  <!-- ██ GLOW ORBS ██ -->
  <ellipse class="orb-purple" cx="800" cy="130" rx="480" ry="100"/>
  <ellipse class="orb-cyan"   cx="800" cy="310" rx="580" ry="110"/>

  <!-- Blurred glow behind text -->
  <ellipse cx="800" cy="180" rx="340" ry="60" fill="#bc13fe" fill-opacity="0.07" filter="url(#neonBlur)"/>
  <ellipse cx="800" cy="180" rx="240" ry="40" fill="#00f3ff" fill-opacity="0.05" filter="url(#neonBlur)"/>

  <!-- ██ HORIZON LINE ██ -->
  <path class="horizon" d="M80 320 H1520" stroke="url(#horizGrad)"/>

  <!-- ██ CORNER BRACKETS ██ -->
  <polyline class="bracket" points="40,40 40,20 60,20"/>
  <polyline class="bracket" points="1560,40 1560,20 1540,20"/>
  <polyline class="bracket" points="40,380 40,400 60,400"/>
  <polyline class="bracket" points="1560,380 1560,400 1540,400"/>

  <!-- ██ FLOATING PARTICLES ██ -->
  <circle class="particle" cx="150"  cy="380" r="1.5" style="animation-delay:0s"/>
  <circle class="particle" cx="320"  cy="350" r="1"   style="animation-delay:1.2s"/>
  <circle class="particle" cx="480"  cy="390" r="1.8" style="animation-delay:2.4s"/>
  <circle class="particle" cx="650"  cy="370" r="1.2" style="animation-delay:0.8s"/>
  <circle class="particle" cx="950"  cy="360" r="1.5" style="animation-delay:3.6s"/>
  <circle class="particle" cx="1100" cy="385" r="1"   style="animation-delay:1.8s"/>
  <circle class="particle" cx="1280" cy="375" r="1.4" style="animation-delay:4.2s"/>
  <circle class="particle" cx="1450" cy="395" r="1.1" style="animation-delay:0.5s"/>

  <!-- ██ VIGNETTE OVERLAY ██ -->
  <rect width="1600" height="420" fill="url(#vignette)"/>

  <!-- ██ TEXT ██ -->
  <text class="title-main" x="800" y="188" text-anchor="middle">
    Parth Wankhede
  </text>

  <!-- blinking cursor after name -->
  <rect class="cursor" x="1095" y="155" width="14" height="38" rx="2"/>

  <text class="title-sub" x="800" y="248" text-anchor="middle">
    SYSTEM PROGRAMMER  //  DSA ENGINEER
  </text>

  <text class="title-bottom" x="800" y="355" text-anchor="middle">
    ⟨ CYBER PROFILE INTERFACE ⟩
  </text>

  <!-- small decorative text -->
  <text x="65"   y="37"  fill="#00f3ff" fill-opacity="0.25" font-family="Share Tech Mono, Consolas, monospace" font-size="10">SYS.INIT</text>
  <text x="1470" y="37"  fill="#bc13fe" fill-opacity="0.25" font-family="Share Tech Mono, Consolas, monospace" font-size="10">v2.0.26</text>
  <text x="65"   y="410" fill="#bc13fe" fill-opacity="0.2"  font-family="Share Tech Mono, Consolas, monospace" font-size="10">NODE::ACTIVE</text>
  <text x="1450" y="410" fill="#00f3ff" fill-opacity="0.2"  font-family="Share Tech Mono, Consolas, monospace" font-size="10">LINK::SECURE</text>
</svg>
